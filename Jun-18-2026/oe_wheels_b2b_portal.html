<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OE Wheels B2B Portal - Home</title>
    <script src="https://cdn.tailwindcss.com/"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js" crossorigin="anonymous"></script>
    <script>
        Babel.registerPreset('react-classic', {
            presets: [
                [Babel.availablePresets.react, { runtime: 'classic' }]
            ]
        });
    </script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect, useRef } = React;

        // ── ICONS ──
        const Icon = ({ path, className = "w-6 h-6", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {path}
            </svg>
        );

        const ArrowLeft   = (p) => <Icon {...p} path={<><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></>} />;
        const ArrowRight  = (p) => <Icon {...p} path={<><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>} />;
        const Car         = (p) => <Icon {...p} path={<><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></>} />;
        const ChevronDown = (p) => <Icon {...p} path={<path d="m6 9 6 6 6-6"/>} />;
        const ChevronLeft = (p) => <Icon {...p} path={<path d="m15 18-6-6 6-6"/>} />;
        const ChevronRight= (p) => <Icon {...p} path={<path d="m9 18 6-6-6-6"/>} />;
        const CircleHelp  = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></>} />;
        const CreditCard  = (p) => <Icon {...p} path={<><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></>} />;
        const FileText    = (p) => <Icon {...p} path={<><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></>} />;
        const Grid        = (p) => <Icon {...p} path={<><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></>} />;
        const Hash        = (p) => <Icon {...p} path={<><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></>} />;
        const Info        = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>} />;
        const ListIcon    = (p) => <Icon {...p} path={<><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/></>} />;
        const Lock        = (p) => <Icon {...p} path={<><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>} />;
        const LogIn       = (p) => <Icon {...p} path={<><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></>} />;
        const LogOut      = (p) => <Icon {...p} path={<><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></>} />;
        const MapPin      = (p) => <Icon {...p} path={<><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></>} />;
        const Menu        = (p) => <Icon {...p} path={<><path d="M4 12h16"/><path d="M4 18h16"/><path d="M4 6h16"/></>} />;
        const Package     = (p) => <Icon {...p} path={<><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></>} />;
        const Pencil      = (p) => <Icon {...p} path={<><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></>} />;
        const Percent     = (p) => <Icon {...p} path={<><line x1="19" x2="5" y1="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></>} />;
        const Phone       = (p) => <Icon {...p} path={<><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></>} />;
        const Search      = (p) => <Icon {...p} path={<><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></>} />;
        const Settings    = (p) => <Icon {...p} path={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>} />;
        const ShoppingCart= (p) => <Icon {...p} path={<><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></>} />;
        const SlidersVertical=(p)=><Icon {...p} path={<><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/></>} />;
        const Star        = (p) => <Icon {...p} path={<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>} />;
        const Tag         = (p) => <Icon {...p} path={<><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></>} />;
        const TrendingUp  = (p) => <Icon {...p} path={<><path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/></>} />;
        const Truck       = (p) => <Icon {...p} path={<><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></>} />;
        const User        = (p) => <Icon {...p} path={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} />;
        const X           = (p) => <Icon {...p} path={<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>} />;

        // ── OEW LOGO ──
        const OewLogo = ({ className = "h-10 w-auto", fill = "#1d4ed8" }) => (
            <svg viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg" className={className}>
                <g transform="skewX(-20) translate(40, 0)" fill={fill} fillRule="evenodd">
                    <path d="M0,0 L80,0 L80,100 L0,100 Z M25,25 L25,75 L55,75 L55,25 Z" />
                    <path d="M90,0 L160,0 L160,100 L90,100 Z M160,25 L115,25 L115,45 L140,45 L140,60 L115,60 L115,75 L160,75 Z" />
                    <path d="M170,0 L250,0 L250,100 L170,100 Z M190,0 L190,75 L200,75 L200,0 Z M220,0 L220,75 L230,75 L230,0 Z" />
                </g>
            </svg>
        );

        // ── HEADER ──
        function Header({ 
            currentView, navigateTo, isMobileMenuOpen, setIsMobileMenuOpen,
            isStoreModalOpen, setIsStoreModalOpen,
            isAddPaymentModalOpen, setIsAddPaymentModalOpen
        }) {
            const isLoggedIn = currentView !== "home" && currentView !== "login" && currentView !== "apply";
            const [isProfileOpen, setIsProfileOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState("");
            const [retailMode, setRetailMode] = useState(false);
            const [catalogMode, setCatalogMode] = useState(false);
            const profileRef = useRef(null);

            // Context Bar States
            const [isLocationDropdownOpen, setIsLocationDropdownOpen] = useState(false);
            const [isAddingNewAddress, setIsAddingNewAddress] = useState(false);
            const locationDropdownRef = useRef(null);

            useEffect(() => {
                function handleClickOutside(event) {
                    if (profileRef.current && !profileRef.current.contains(event.target)) {
                        setIsProfileOpen(false);
                    }
                    if (locationDropdownRef.current && !locationDropdownRef.current.contains(event.target)) {
                        setIsLocationDropdownOpen(false);
                    }
                }
                document.addEventListener("mousedown", handleClickOutside);
                return () => {
                    document.removeEventListener("mousedown", handleClickOutside);
                };
            }, []);

            return (
                <header className="relative flex-shrink-0 flex flex-col w-full shadow-sm z-[100]">
                    {/* Public nav */}
                    {!isLoggedIn && (
                        <div className="h-20 bg-slate-50 border-b border-slate-200">
                            <div className="max-w-[1380px] mx-auto px-6 h-full">
                                <div className="flex justify-between items-center h-full">
                                    <div className="flex-shrink-0 flex items-center cursor-pointer" onClick={() => navigateTo("home")}>
                                        <OewLogo className="h-8 md:h-10 w-auto" fill="#1d4ed8" />
                                    </div>
                                    <nav className="hidden md:flex space-x-8 items-center">
                                        <button onClick={() => navigateTo("home")} className="text-slate-600 hover:text-blue-600 font-medium">Home</button>
                                        <a href="#brands" className="text-slate-600 hover:text-blue-600 font-medium">Our Brands</a>
                                        <a href="#about" className="text-slate-600 hover:text-blue-600 font-medium">About Us</a>
                                        <div className="flex items-center space-x-4 border-l pl-6 border-slate-200">
                                            <button onClick={() => navigateTo("login")} className="flex items-center text-slate-700 hover:text-blue-600 font-semibold">
                                                <LogIn className="w-4 h-4 mr-2" /> Dealer Login
                                            </button>
                                            <button onClick={() => navigateTo("apply")} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-md font-semibold transition-colors shadow-sm">
                                                Apply Now
                                            </button>
                                        </div>
                                    </nav>
                                    <div className="lg:hidden flex items-center">
                                        <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-slate-500 hover:text-slate-700">
                                            {isMobileMenuOpen ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Authenticated nav */}
                    {isLoggedIn && (
                        <div className="flex flex-col w-full">
                            
                            {/* Context Bar (Topmost strip) */}
                            <div className="bg-slate-100 border-b border-slate-300 w-full h-11 flex items-center justify-between z-[110] relative">
                                <div className="max-w-[1380px] mx-auto px-6 w-full flex justify-between items-center h-full">
                                    {/* Left side: Store Location */}
                                    <div className="flex items-center relative h-full" ref={locationDropdownRef}>
                                        <MapPin className="w-4 h-4 text-slate-500 mr-1.5" />
                                        <button 
                                            className="flex items-center space-x-1 group"
                                            onClick={() => setIsLocationDropdownOpen(!isLocationDropdownOpen)}
                                        >
                                            <span className="font-bold text-[13px] text-slate-800 transition-colors">O.E. WHEEL DISTRIBUTORS, LLC</span>
                                            <ChevronDown className="w-4 h-4 text-slate-500 ml-1" />
                                        </button>
                                        <button 
                                            onClick={() => setIsStoreModalOpen(true)}
                                            className="border border-slate-300 rounded px-3 py-1 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors ml-3"
                                        >
                                            Change
                                        </button>

                                        {/* Location Expanded Dropdown */}
                                        {isLocationDropdownOpen && (
                                            <div className="absolute top-[36px] left-0 w-72 bg-white border border-slate-200 rounded-lg shadow-lg py-3 px-4 z-[9999] pointer-events-auto">
                                                <p className="font-bold text-[14px] text-slate-900 mb-1">O.E. WHEEL DISTRIBUTORS, LLC</p>
                                                <p className="text-[12px] text-slate-600 mb-0.5">1916 72nd Dr E, Sarasota, FL 34243</p>
                                            </div>
                                        )}
                                    </div>

                                    {/* Right side: Sales Rep */}
                                    <div className="hidden sm:flex items-center">
                                        <User className="w-4 h-4 text-slate-500 mr-1.5" />
                                        <span className="text-[11px] text-slate-500 mr-1.5">Sales Rep:</span>
                                        <span className="font-bold text-[12px] text-slate-800">Akshay Akulwar</span>
                                        <span className="text-slate-300 mx-2">|</span>
                                        <Phone className="w-3 h-3 text-slate-500 mr-1" />
                                        <span className="text-[12px] text-slate-600 mr-1">Direct Line:</span>
                                        <a href="tel:9419210065" className="text-[12px] text-slate-600">941-921-0065</a>
                                    </div>
                                </div>
                            </div>

                            {/* Row 1 — Logo, Search, Account/Tools */}
                            <div className="h-16 bg-slate-50 border-b border-slate-100 w-full">
                                <div className="max-w-[1380px] mx-auto px-6 h-full flex items-center justify-between w-full">
                                    <div className="flex-shrink-0 flex items-center cursor-pointer" onClick={() => navigateTo('dashboard')}>
                                        <OewLogo className="h-10 w-auto" fill="#1d4ed8" />
                                    </div>
                                    
                                    <div className="flex-1 max-w-lg mx-6 relative group hidden md:flex items-center">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                            <Search className="h-4 w-4 text-slate-400 group-focus-within:text-blue-600 transition-colors" />
                                        </div>
                                        <input type="text" className="block w-full pl-10 pr-24 py-3 border-0 ring-1 ring-slate-200 rounded-full bg-white shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-medium transition-all" placeholder="Search by SKU, Vehicle or Brand..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                                        <button className="absolute inset-y-1.5 bottom-1.5 top-1.5 right-1.5 bg-blue-600 hover:bg-blue-700 text-white px-7 rounded-full font-bold text-xs transition-colors shadow-sm flex items-center justify-center">Search</button>
                                    </div>

                                    <div className="flex items-center h-full flex-shrink-0">
                                        <div className="hidden lg:flex items-center space-x-6 mr-6 h-full">
                                            <button onClick={() => navigateTo('orders')} className={`${currentView === 'orders' ? 'text-blue-600 border-b-2 border-blue-600 h-16 pt-[2px]' : 'text-slate-600 hover:text-blue-600'} flex items-center font-bold text-[13px] transition-all h-full`}>
                                                <Package className="w-5 h-5 mr-1.5 text-slate-500" strokeWidth={1.5} /> My Orders
                                            </button>
                                            <button onClick={() => navigateTo('invoices')} className={`${currentView === 'invoices' ? 'text-blue-600 border-b-2 border-blue-600 h-16 pt-[2px]' : 'text-slate-600 hover:text-blue-600'} flex items-center font-bold text-[13px] transition-all h-full`}>
                                                <ListIcon className="w-5 h-5 mr-1.5 text-slate-500" strokeWidth={1.5} /> My Invoices
                                            </button>
                                            <button onClick={() => navigateTo('quotes')} className={`${currentView === 'quotes' ? 'text-blue-600 border-b-2 border-blue-600 h-16 pt-[2px]' : 'text-slate-600 hover:text-blue-600'} flex items-center font-bold text-[13px] transition-all h-full`}>
                                                <FileText className="w-5 h-5 mr-1.5 text-slate-500" strokeWidth={1.5} /> My Quotes
                                            </button>
                                        </div>
                                        <div className="hidden lg:block h-6 border-l border-slate-300 mr-6"></div>
                                        <div className="relative h-full flex items-center" ref={profileRef}>
                                            <button onClick={() => setIsProfileOpen(!isProfileOpen)} className="flex items-center cursor-pointer p-1 rounded-md transition-colors">
                                                <div className="hidden md:flex flex-col text-right mr-3">
                                                    <span className="text-[13px] font-extrabold text-slate-900 leading-tight">My Account</span>
                                                </div>
                                                <div className="w-8 h-8 bg-[#1e293b] text-white rounded-full flex items-center justify-center font-bold shadow-sm text-xs">JD</div>
                                            </button>
                                            <button className="text-slate-700 hover:text-blue-600 relative ml-6 mr-2">
                                                <ShoppingCart className="w-5 h-5" strokeWidth={1.5} />
                                                <span className="absolute -top-2.5 -right-3 bg-blue-600 text-white text-[10px] font-bold rounded-full h-[20px] min-w-[20px] px-1 flex items-center justify-center border-2 border-white shadow-sm">10</span>
                                            </button>
                                            {isProfileOpen && (
                                                <div className="absolute right-0 top-[52px] w-72 bg-white border border-slate-200 rounded-lg shadow-xl py-2 z-[9999] pointer-events-auto">
                                                    <div className="px-4 py-3 border-b border-slate-100">
                                                        <p className="text-sm font-semibold text-slate-900">John Doe</p>
                                                        <p className="text-xs text-slate-500 truncate">luckytire@ymail.com</p>
                                                    </div>
                                                    
                                                    <div className="flex flex-col border-b border-slate-100">
                                                        <div className="flex items-center justify-between px-4 py-3">
                                                            <div className="flex items-start gap-2">
                                                                <Tag className="w-4 h-4 text-slate-500 mt-0.5" />
                                                                <div>
                                                                    <p className="font-bold text-[13px] text-slate-900">Retail Mode</p>
                                                                    <p className="text-[11px] text-slate-500">Hide all wholesale pricing sitewide</p>
                                                                </div>
                                                            </div>
                                                            <button 
                                                                onClick={() => setRetailMode(!retailMode)}
                                                                className={`flex-shrink-0 w-10 h-6 rounded-full transition-colors flex items-center px-0.5 ${retailMode ? 'bg-blue-600' : 'bg-slate-200'}`}
                                                            >
                                                                <div className={`w-5 h-5 bg-white rounded-full shadow-sm transition-transform ${retailMode ? 'translate-x-4' : 'translate-x-0'}`}></div>
                                                            </button>
                                                        </div>

                                                        <div className="flex items-center justify-between px-4 py-3 border-t border-slate-100">
                                                            <div className="flex items-start gap-2">
                                                                <Grid className="w-4 h-4 text-slate-500 mt-0.5" />
                                                                <div>
                                                                    <p className="font-bold text-[13px] text-slate-900">Catalog Mode</p>
                                                                    <p className="text-[11px] text-slate-500">Hide all pricing sitewide</p>
                                                                </div>
                                                            </div>
                                                            <button 
                                                                onClick={() => setCatalogMode(!catalogMode)}

                                            <MapPin className="w-5 h-5 mr-2 text-slate-500" /> Current Store
                                        </h2>
                                        <button onClick={() => setIsStoreModalOpen(true)} className="border border-slate-300 rounded-lg px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors shadow-sm">
                                            Change Store
                                        </button>
                                    </div>
                                    
                                    <div className="mb-5">
                                        <p className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Store Name</p>
                                        <p className="font-bold text-[14px] text-[#1e3a6e]">Lucky Tire & Wheels</p>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12 mb-3">
                                        <div>
                                            <p className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Shipping Address</p>
                                            <div className="space-y-0.5">
                                                <p className="font-bold text-[13px] text-slate-900">Akshay B2B Test Company</p>
                                                <p className="text-[13px] text-slate-600">1916 72ND DR E, Sarasota, FL 34243</p>
                                                <p className="text-[13px] text-slate-600">United States</p>
                                            </div>
                                        </div>
                                        <div>
                                            <p className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Billing Address</p>
                                            <div className="space-y-0.5">
                                                <p className="font-bold text-[13px] text-slate-900">Akshay B2B Test Company</p>
                                                <p className="text-[13px] text-slate-600">1916 72ND DR E, Sarasota, FL 34243</p>
                                                <p className="text-[13px] text-slate-600">United States</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 flex items-start gap-2">
                                        <Info className="w-4 h-4 text-blue-500 flex-shrink-0 mt-0.5" />
                                        <div>
                                            <p className="text-[13px] text-slate-700 font-semibold mb-1">Need to make changes to your account?</p>
                                            <p className="text-[12px] text-slate-500 mb-2">Shipping address and account detail updates must be made through your account representative.</p>
                                            <button onClick={() => navigateTo('support')} className="text-[12px] text-blue-600 font-medium hover:underline">Contact Support &rarr;</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Card 3 - Payment Methods */}
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden w-full">
                                <div className="p-6">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-[16px] font-bold text-slate-900 flex items-center">
                                            <CreditCard className="w-5 h-5 mr-2 text-slate-500" /> Payment Methods
                                        </h2>
                                        <button onClick={() => setIsAddPaymentModalOpen(true)} className="border border-slate-300 rounded-lg px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors shadow-sm">
                                            + Add Payment Method
                                        </button>
                                    </div>

                                    {/* Saved Card Row */}
                                    <div className="border border-slate-200 rounded-lg p-4 flex justify-between items-center bg-white shadow-sm">
                                        <div className="flex items-center space-x-4">
                                            <div className="bg-slate-100 p-2 rounded">
                                                <CreditCard className="w-6 h-6 text-slate-700" />
                                            </div>
                                            <div>
                                                <p className="font-bold text-[13px] text-slate-800">Visa ending in 4242</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center space-x-6">
                                            <p className="text-[12px] text-slate-500">Expires 04/2029</p>
                                            <button className="border border-red-300 rounded-lg px-3 py-1 text-sm font-semibold text-red-500 hover:bg-red-50 transition-colors">Remove</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        }

        // ── PLACEHOLDER VIEWS ──
        // These are intentionally empty stubs. Build each one out separately.
        function OrdersView({ navigateTo }) { return null; }
        function InvoicesView({ navigateTo }) { return null; }
        function QuotesView({ navigateTo }) { return null; }

        // ── PUBLIC HOME VIEW ──
        function HomeView({ navigateTo }) {
            return (
                <div className="flex flex-col w-full h-full justify-center items-center bg-slate-900 relative">
                    <div className="relative z-10 text-center px-4 pt-32 pb-32">
                        <h1 className="text-4xl md:text-6xl font-extrabold text-white mb-6 drop-shadow-lg tracking-tight max-w-4xl">Premium OEM & Aftermarket Wheels</h1>
                        <div className="flex flex-col sm:flex-row gap-4 justify-center mt-8">
                            <button onClick={() => navigateTo("login")} className="px-8 py-4 bg-white text-blue-700 font-bold rounded-md shadow-lg hover:bg-slate-100 transition-all text-lg flex items-center justify-center"><LogIn className="w-5 h-5 mr-2" /> Dealer Login</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ── LOGIN VIEW ──
        function LoginView({ navigateTo }) {
            const handleLogin = (e) => { e.preventDefault(); navigateTo("dashboard"); };
            return (
                <div className="flex-grow flex items-center justify-center py-12 px-4 bg-slate-100">
                    <div className="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg border border-slate-200">
                        <h2 className="text-center text-3xl font-extrabold text-slate-900">Dealer Portal Login</h2>
                        <form className="mt-8 space-y-6" onSubmit={handleLogin}>
                            <div className="rounded-md shadow-sm space-y-4">
                                <input name="email" type="email" required className="block w-full px-3 py-3 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="Email address" defaultValue="luckytire@ymail.com" />
                                <input name="password" type="password" required className="block w-full px-3 py-3 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="Password" defaultValue="password" />
                            </div>
                            <button type="submit" className="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition-colors">Sign In to Portal</button>
                        </form>
                    </div>
                </div>
            );
        }

        // ── APPLY VIEW ──
        function ApplyView({ navigateTo }) {
            return (
                <div className="flex-grow flex items-center justify-center bg-slate-50 p-8">
                    <div className="text-center">
                        <h2 className="text-2xl font-bold mb-4">Application Form</h2>
                        <button onClick={() => navigateTo("home")} className="px-4 py-2 bg-blue-600 text-white rounded">Back to Home</button>
                    </div>
                </div>
            );
        }

        // ── FOOTER ──
        function Footer() {
            return (
                <footer className="bg-[#0b1120] text-slate-300 py-16 flex-shrink-0">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10">
                            <div>
                                <div className="mb-6"><OewLogo className="h-10 w-auto" fill="#ffffff" /></div>
                                <p className="text-slate-400 text-[15px] leading-relaxed pr-4">The premier B2B distributor for premium OEM replica and aftermarket wheels.</p>
                            </div>
                        </div>
                        <div className="border-t border-slate-800 mt-16 pt-8 text-center">
                            <p className="text-[15px] text-slate-500">© 2026 OE Wheels, LLC. All rights reserved. (Demo Prototype)</p>
                        </div>
                    </div>
                </footer>
            );
        }

        // ── APP ROUTER ──
        function App() {
            const [route, setRoute] = useState({ name: "dashboard", params: {} });
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            // Lifted Modal States
            const [isStoreModalOpen, setIsStoreModalOpen] = useState(false);
            const [isAddPaymentModalOpen, setIsAddPaymentModalOpen] = useState(false);

            const navigateTo = (viewName, params = {}) => {
                setRoute({ name: viewName, params });
                setIsMobileMenuOpen(false);
                window.scrollTo(0, 0);
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 font-sans">
                    <Header 
                        currentView={route.name} 
                        navigateTo={navigateTo} 
                        isMobileMenuOpen={isMobileMenuOpen} 
                        setIsMobileMenuOpen={setIsMobileMenuOpen} 
                        isStoreModalOpen={isStoreModalOpen}
                        setIsStoreModalOpen={setIsStoreModalOpen}
                        isAddPaymentModalOpen={isAddPaymentModalOpen}
                        setIsAddPaymentModalOpen={setIsAddPaymentModalOpen}
                    />
                    <main className="flex-1 flex flex-col">
                        {route.name === "home"      && <HomeView navigateTo={navigateTo} />}
                        {route.name === "login"     && <LoginView navigateTo={navigateTo} />}
                        {route.name === "apply"     && <ApplyView navigateTo={navigateTo} />}
                        {route.name === "dashboard" && <DashboardView navigateTo={navigateTo} />}
                        {route.name === "my-profile" && <MyProfileView navigateTo={navigateTo} setIsStoreModalOpen={setIsStoreModalOpen} setIsAddPaymentModalOpen={setIsAddPaymentModalOpen} />}
                        {route.name === "orders"    && <OrdersView navigateTo={navigateTo} />}
                        {route.name === "invoices"  && <InvoicesView navigateTo={navigateTo} />}
                        {route.name === "quotes"    && <QuotesView navigateTo={navigateTo} />}
                        {/* TODO: Add new views here */}
                    </main>
                    <Footer />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
